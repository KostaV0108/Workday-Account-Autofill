<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 12px; width: 240px; }
    input { width: 100%; margin: 4px 0 10px; padding: 6px; box-sizing: border-box; }
    button { width: 100%; padding: 8px; background: #0066cc; color: white; border: none; cursor: pointer; border-radius: 4px; }
  </style>
</head>
<body>
  <h3>Workday Autofill</h3>
  <label>Email</label>
  <input type="email" id="email" placeholder="you@example.com" />
  <label>Password</label>
  <input type="password" id="password" placeholder="Your password" />
  <button id="save">Save Credentials</button>
  <p id="status" style="color: green; font-size: 12px;"></p>

  <script src="popup.js"></script>
</body>
</html>
